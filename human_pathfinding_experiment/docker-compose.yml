services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=human_pathfinding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d human_pathfinding"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
      - ../config:/app/config:ro
      - ../results/human_experiments:/app/results
      - ../thund_avoider:/app/thund_avoider:ro
    environment:
      - DATA_PATH=/app/data
      - CONFIG_PATH=/app/config
      - RESULTS_PATH=/app/results
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/human_pathfinding
      - PYTHONPATH=/app
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - OBSTACLE_CACHE_SIZE=${OBSTACLE_CACHE_SIZE:-2}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: human-pathfinding-network

volumes:
  postgres_data:
